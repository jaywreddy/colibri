[project]
name = "optics-backend"
version = "0.1.0"
description = "Backend for the dual-layer gold-on-quartz optical pattern studio"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "numpy>=2.0",
    "scipy>=1.14",
    "Pillow>=11.0",
    "shapely>=2.0",
    "drawsvg>=2.4",
    "pydantic>=2.9",
]

[project.optional-dependencies]
sim = [
    "LightPipes>=2.1",
]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
