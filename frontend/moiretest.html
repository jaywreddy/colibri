<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>moire two-plane rig</title>
  <style>
    html, body { margin: 0; background: #0b0e16; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script type="module">
    // Sub-case rig: TWO real PlaneGeometry layers separated by the true
    // scene-scaled 500 um slab, each carrying a REAL single-layer stripe
    // pattern. NO cross-layer shader math — the moire beat (and the parallax
    // switch) must emerge purely from perspective projection + alpha overlap.
    //
    // Query params (all optional):
    //   p      front period (um)              default 170
    //   ratio  back/front period ratio        default 1.0
    //   ang    back grating angle offset deg  default 0
    //   duty   gold-line fraction             default 0.5
    //   az,el  camera az/el deg               default 0 / 5
    //   dist   camera distance multiplier     default 1.0
    //   aa     MSAA on(1)/off(0)              default 1
    //   filter texture mode filter linear|nearest (only render=texture)
    //   render procedural|texture             default procedural
    //   phase  extra front/back half-phase(0/0.5) for the switch test  default 0
    import * as THREE from 'three';

    const q = new URLSearchParams(location.search);
    const num = (k, d) => { const v = q.get(k); return v == null ? d : parseFloat(v); };
    const str = (k, d) => { const v = q.get(k); return v == null ? d : v; };

    const P = num('p', 170);
    const ratio = num('ratio', 1.0);
    const angDeg = num('ang', 0);
    const duty = num('duty', 0.5);
    const az = num('az', 0) * Math.PI / 180;
    const el = num('el', 5) * Math.PI / 180;
    const dist = num('dist', 1.0);
    const aa = num('aa', 1);
    const filter = str('filter', 'linear');
    const render = str('render', 'procedural');
    const halfPhase = num('phase', 0.0);

    const W = 1280, H = 900;
    const renderer = new THREE.WebGLRenderer({ antialias: aa > 0.5, preserveDrawingBuffer: true });
    renderer.setPixelRatio(1); // deterministic px/period math
    renderer.setSize(W, H, false);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0e16);
    const camera = new THREE.PerspectiveCamera(45, W / H, 0.05, 100);

    // Real geometry: box wall 50 mm; scene scale = 1.4 / 50 (matches BoxScene
    // TARGET_SCENE_SIZE / max dim). Slab 500 um. Plate spans 50 mm.
    const scale = 1.4 / 50;          // scene units per mm
    const plateMM = 50;
    const plate = plateMM * scale;   // ~1.4 units
    const Tsc = (500 / 1000) * scale; // 500 um slab in scene units
    const UM_TO_UNIT = plate / (plateMM * 1000); // scene units per um across plate

    function stripeMat(periodUm, angleRad, phase, alphaMode) {
      return new THREE.ShaderMaterial({
        transparent: alphaMode,
        depthWrite: !alphaMode,
        side: THREE.DoubleSide,
        uniforms: {
          uPeriodUv: { value: periodUm / (plateMM * 1000) }, // period in uv units
          uAng: { value: angleRad },
          uPhase: { value: phase },
          uDuty: { value: duty },
          uAlpha: { value: alphaMode ? 1.0 : 0.0 },
        },
        vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
        fragmentShader: `precision highp float; varying vec2 vUv;
          uniform float uPeriodUv, uAng, uPhase, uDuty, uAlpha;
          void main(){
            float c = cos(uAng), s = sin(uAng);
            float coord = (vUv.x * c + vUv.y * s) / uPeriodUv + uPhase;
            float f = fract(coord);
            float w = fwidth(coord);
            float aaw = clamp(w, 0.0004, 0.5);
            float line = smoothstep(0.0, aaw, f) - smoothstep(uDuty, uDuty + aaw, f);
            vec3 gold = vec3(0.902, 0.737, 0.314);
            if (uAlpha > 0.5) { gl_FragColor = vec4(gold, line); }
            else { gl_FragColor = vec4(gold * line + vec3(0.03) * (1.0 - line), 1.0); }
          }`,
      });
    }

    function stripeTexture(periodUm, angleRad, phase) {
      // Bake a stripe grating into a texture at a fixed high resolution, so we
      // can compare filtered-texture sampling vs procedural fwidth AA.
      const N = 2048;
      const data = new Uint8Array(N * N * 4);
      const periodUv = periodUm / (plateMM * 1000);
      const c = Math.cos(angleRad), s = Math.sin(angleRad);
      for (let y = 0; y < N; y++) {
        for (let x = 0; x < N; x++) {
          const u = x / N, v = y / N;
          const coord = (u * c + v * s) / periodUv + phase;
          const f = coord - Math.floor(coord);
          const on = f < duty ? 1 : 0;
          const i = (y * N + x) * 4;
          data[i] = on ? 230 : 8;
          data[i + 1] = on ? 188 : 8;
          data[i + 2] = on ? 80 : 8;
          data[i + 3] = 255;
        }
      }
      const tex = new THREE.DataTexture(data, N, N, THREE.RGBAFormat);
      tex.magFilter = filter === 'nearest' ? THREE.NearestFilter : THREE.LinearFilter;
      tex.minFilter = filter === 'nearest' ? THREE.NearestFilter : THREE.LinearMipmapLinearFilter;
      tex.generateMipmaps = filter !== 'nearest';
      tex.anisotropy = 8;
      tex.needsUpdate = true;
      return tex;
    }

    const g = new THREE.PlaneGeometry(plate, plate);
    let back, front;
    if (render === 'texture') {
      const backTex = stripeTexture(P * ratio, angDeg * Math.PI / 180, 0.0);
      const frontTex = stripeTexture(P, 0.0, halfPhase);
      back = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ map: backTex, side: THREE.DoubleSide }));
      front = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ map: frontTex, transparent: true, side: THREE.DoubleSide }));
      // For texture front we need transparency in gaps: use alphaTest on gold.
      front.material.alphaTest = 0.5;
      front.material.map.colorSpace = THREE.SRGBColorSpace;
    } else {
      back = new THREE.Mesh(g, stripeMat(P * ratio, angDeg * Math.PI / 180, 0.0, false));
      front = new THREE.Mesh(g, stripeMat(P, 0.0, halfPhase, true));
    }
    back.position.z = -Tsc / 2;
    front.position.z = +Tsc / 2;
    front.renderOrder = 1;
    scene.add(back);
    scene.add(front);

    const r = 2.4 * dist;
    camera.position.set(
      r * Math.cos(el) * Math.sin(az),
      r * Math.sin(el),
      r * Math.cos(el) * Math.cos(az)
    );
    camera.lookAt(0, 0, 0);
    camera.updateMatrixWorld();
    camera.updateProjectionMatrix();

    // Screen px spanned by one front period at plate center.
    function pxPerPeriod() {
      const dUnit = P * UM_TO_UNIT; // one period in scene x units
      const a = new THREE.Vector3(-dUnit / 2, 0, Tsc / 2).project(camera);
      const b = new THREE.Vector3(+dUnit / 2, 0, Tsc / 2).project(camera);
      return Math.abs((b.x - a.x) * 0.5 * W);
    }
    window.__ppp = pxPerPeriod();

    const tick = () => { renderer.render(scene, camera); requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
    window.__ready = true;
  </script>
</body>
</html>
